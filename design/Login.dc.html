<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    /* docs/DESIGN.md 와 src/app/globals.css 의 @theme 값을 그대로 옮긴 것.
       한쪽을 바꾸면 다른 쪽도 바꾼다. */
    :root {
      --paper: oklch(0.985 0.003 85);
      --surface: oklch(1 0 0);
      --ink: oklch(0.24 0.015 265);
      --ink-muted: oklch(0.44 0.012 265);
      --ink-faint: oklch(0.55 0.011 265);
      --rule: oklch(0.89 0.006 265);
      --rule-soft: oklch(0.94 0.004 265);
      --seal: oklch(0.45 0.15 22);
      --seal-deep: oklch(0.36 0.15 22);
      --warn: oklch(0.55 0.11 70);
      --danger: oklch(0.52 0.17 27);
      --ok: oklch(0.45 0.09 155);
      --focus: oklch(0.52 0.16 258);
      --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", monospace;
      --work: 1200px;
      --read: 62ch;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    a { color: var(--seal); text-decoration: none; }
    a:hover { color: var(--seal-deep); text-decoration: underline; }

    /* 타입 램프 */
    .t-title { font-size: 28px; line-height: 1.28; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
    .t-section { font-size: 20px; line-height: 1.4; font-weight: 600; margin: 0; }
    .t-body { font-size: 16px; line-height: 1.65; }
    .t-small { font-size: 14px; line-height: 1.6; }
    .t-note { font-size: 12px; line-height: 1.5; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* 실제 코드의 컨트롤 크기 (h-11 = 44px, h-10 = 40px) */
    .field { height: 44px; border: 1px solid var(--rule); background: var(--surface); padding: 0 12px; font-family: var(--sans); font-size: 16px; color: var(--ink); width: 100%; }
    .area { border: 1px solid var(--rule); background: var(--surface); padding: 12px; font-family: var(--sans); font-size: 16px; line-height: 1.65; width: 100%; }
    .btn-submit { height: 44px; width: 100%; border: 0; background: var(--seal); color: var(--surface); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; }
    .tab { height: 40px; padding: 0 16px; border: 0; background: transparent; font-family: var(--sans); font-size: 14px; font-weight: 500; color: var(--ink-muted); cursor: pointer; }
    .tab-on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--seal); }

    /* 선택 카드 — 입력 방식을 탭이 아니라 카드로 고른다 */
    .pick { border: 1px solid var(--rule); background: var(--surface); padding: 20px; cursor: pointer; text-align: left; font-family: var(--sans); width: 100%; }
    .pick-on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .btn-ghost { height: 40px; padding: 0 16px; border: 1px solid var(--rule); background: var(--surface); font-family: var(--sans); font-size: 14px; color: var(--ink); cursor: pointer; }
    .chip { display: inline-block; padding: 3px 8px; border: 1px solid var(--rule); font-size: 12px; color: var(--ink-muted); }
    .thumb { aspect-ratio: 16 / 9; background: oklch(0.972 0.004 90); border: 1px solid var(--rule); position: relative; }
    .lbl { font-size: 14px; line-height: 1.6; color: var(--ink-muted); }
  </style>
</helmet>

<div style="min-height: 100%; background: var(--paper); display: grid; grid-template-columns: 1fr 1fr;">

  <!-- 좌: 제품이 무엇을 해주는지. 로그인 화면이 빈 폼만 있으면 왜 가입하는지 알 수 없다 -->
  <div style="padding: 64px 56px; border-right: 1px solid var(--rule); display: flex; flex-direction: column;">
    <div style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 56px;">[서비스명]</div>

    <h1 style="margin: 0 0 18px; font-size: 34px; line-height: 1.25; font-weight: 600; letter-spacing: -0.02em; max-width: 22ch;">회사 자료를 넣으면 근거가 붙은 IR 12장이 나옵니다</h1>
    <p style="margin: 0 0 44px; font-size: 16px; line-height: 1.65; color: var(--ink-muted); max-width: 40ch;">없는 사실을 지어내지 않습니다. 자료에서 확인된 것과 분석이 붙은 해석을 슬라이드에서 구분해 표시합니다.</p>

    <!-- 방주 색단을 로그인 화면에서도 써서 제품의 성격을 먼저 보여준다 -->
    <div class="marginalia" style="max-width: 46ch;">
      <div class="marg marg-fact">사실</div>
      <div style="padding: 11px 0; border-bottom: 1px solid var(--rule-soft); font-size: 15px; line-height: 1.6;">자료에 직접 적혀 있는 수치와 사건</div>
      <div class="marg">해석</div>
      <div style="padding: 11px 0; border-bottom: 1px solid var(--rule-soft); font-size: 15px; line-height: 1.6;">여러 자료를 이어 붙인 분석</div>
      <div class="marg">추정</div>
      <div style="padding: 11px 0; border-bottom: 1px solid var(--rule-soft); font-size: 15px; line-height: 1.6;">가정이 들어간 전망. 사선으로 표시</div>
      <div class="marg marg-missing">[ ]</div>
      <div style="padding: 11px 0; font-size: 15px; line-height: 1.6;">확인할 자료가 없는 항목</div>
    </div>

    <div style="margin-top: auto; padding-top: 40px; font-size: 12px; line-height: 1.6; color: var(--ink-faint);">
      슬라이드는 이 컴퓨터의 Codex CLI가 만듭니다. 자료는 본인 계정에만 저장됩니다.
    </div>
  </div>

  <!-- 우: 폼 -->
  <div style="padding: 64px 56px; display: flex; align-items: center; justify-content: center; background: var(--surface);">
    <div style="width: 100%; max-width: 360px;">
      <h2 class="t-section" style="margin: 0 0 6px;">로그인</h2>
      <p style="margin: 0 0 32px; font-size: 14px; color: var(--ink-muted);">만든 자료는 계정에 남습니다.</p>

      <div style="display: flex; flex-direction: column; gap: 18px;">
        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span class="lbl">이메일</span>
          <span class="field" style="display: flex; align-items: center; color: var(--ink-faint);">name@company.com</span>
        </label>
        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span class="lbl">비밀번호</span>
          <span class="field" style="display: flex; align-items: center; letter-spacing: 3px; color: var(--ink-faint);">••••••••</span>
        </label>
        <button class="btn-submit" style="margin-top: 6px;">로그인</button>
      </div>

      <div style="margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--rule-soft); display: flex; align-items: baseline; justify-content: space-between;">
        <span class="t-small" style="color: var(--ink-muted);">계정이 없나요?</span>
        <button class="btn-ghost" style="height: 34px; font-size: 13px;">가입하기</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
