<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    /* docs/DESIGN.md 와 src/app/globals.css 의 @theme 값을 그대로 옮긴 것.
       한쪽을 바꾸면 다른 쪽도 바꾼다. */
    :root {
      --paper: oklch(0.985 0.003 85);
      --surface: oklch(1 0 0);
      --ink: oklch(0.24 0.015 265);
      --ink-muted: oklch(0.44 0.012 265);
      --ink-faint: oklch(0.55 0.011 265);
      --rule: oklch(0.89 0.006 265);
      --rule-soft: oklch(0.94 0.004 265);
      --seal: oklch(0.45 0.15 22);
      --seal-deep: oklch(0.36 0.15 22);
      --warn: oklch(0.55 0.11 70);
      --danger: oklch(0.52 0.17 27);
      --ok: oklch(0.45 0.09 155);
      --focus: oklch(0.52 0.16 258);
      --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", monospace;
      --work: 1200px;
      --read: 62ch;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    a { color: var(--seal); text-decoration: none; }
    a:hover { color: var(--seal-deep); text-decoration: underline; }

    /* 타입 램프 */
    .t-title { font-size: 28px; line-height: 1.28; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
    .t-section { font-size: 20px; line-height: 1.4; font-weight: 600; margin: 0; }
    .t-body { font-size: 16px; line-height: 1.65; }
    .t-small { font-size: 14px; line-height: 1.6; }
    .t-note { font-size: 12px; line-height: 1.5; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* 실제 코드의 컨트롤 크기 (h-11 = 44px, h-10 = 40px) */
    .field { height: 44px; border: 1px solid var(--rule); background: var(--surface); padding: 0 12px; font-family: var(--sans); font-size: 16px; color: var(--ink); width: 100%; }
    .area { border: 1px solid var(--rule); background: var(--surface); padding: 12px; font-family: var(--sans); font-size: 16px; line-height: 1.65; width: 100%; }
    .btn-submit { height: 44px; width: 100%; border: 0; background: var(--seal); color: var(--surface); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; }
    .tab { height: 40px; padding: 0 16px; border: 0; background: transparent; font-family: var(--sans); font-size: 14px; font-weight: 500; color: var(--ink-muted); cursor: pointer; }
    .tab-on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--seal); }

    /* 선택 카드 — 입력 방식을 탭이 아니라 카드로 고른다 */
    .pick { border: 1px solid var(--rule); background: var(--surface); padding: 20px; cursor: pointer; text-align: left; font-family: var(--sans); width: 100%; }
    .pick-on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .btn-ghost { height: 40px; padding: 0 16px; border: 1px solid var(--rule); background: var(--surface); font-family: var(--sans); font-size: 14px; color: var(--ink); cursor: pointer; }
    .chip { display: inline-block; padding: 3px 8px; border: 1px solid var(--rule); font-size: 12px; color: var(--ink-muted); }
    .thumb { aspect-ratio: 16 / 9; background: oklch(0.972 0.004 90); border: 1px solid var(--rule); position: relative; }
    .lbl { font-size: 14px; line-height: 1.6; color: var(--ink-muted); }
  </style>
</helmet>

<div style="min-height: 100%; background: var(--paper);">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--rule);">
    <div style="display: flex; align-items: baseline; gap: 20px;">
      <span style="font-size: 15px; font-weight: 600; letter-spacing: -0.01em;">[서비스명]</span>
      <span class="t-small" style="color: var(--ink); border-bottom: 2px solid var(--seal); padding-bottom: 2px;">새로 만들기</span>
      <span class="t-small" style="color: var(--ink-muted);">내 자료 <span class="num">4</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px;">
      <span class="t-note" style="color: var(--ink-faint);">권광구</span>
      <button style="border: 0; background: transparent; font-family: var(--sans); font-size: 13px; color: var(--ink-muted); text-decoration: underline; cursor: pointer; padding: 0;">로그아웃</button>
    </div>
  </div>

  <div style="margin: 0 auto; width: 100%; max-width: 880px; padding: 44px 28px 64px;">
    <h1 class="t-title" style="margin: 0 0 8px;">무엇으로 만들까요</h1>
    <p style="margin: 0 0 32px; font-size: 16px; line-height: 1.65; color: var(--ink-muted); max-width: 52ch;">회사를 설명하는 자료가 있으면 됩니다. 자료가 구체적일수록 추정이 줄어듭니다.</p>

    <label style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 32px; max-width: 420px;">
      <span class="lbl">회사명</span>
      <span class="field" style="display: flex; align-items: center;">샘플웨이브</span>
    </label>

    <!-- 입력 방식을 탭이 아니라 카드로 고르게 한다. 무엇을 넣는 자리인지 카드 안에서 설명한다 -->
    <div class="t-note" style="color: var(--ink-faint); margin-bottom: 10px;">자료를 넣는 방법</div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px;">
      <button class="pick">
        <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 8px;">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="color: var(--ink-faint);"><path d="M4 4.5 H16"/><path d="M4 8.5 H16"/><path d="M4 12.5 H11"/></svg>
          <span style="font-size: 15px; font-weight: 600;">텍스트 붙여넣기</span>
        </div>
        <div class="t-small" style="color: var(--ink-muted); line-height: 1.55;">연혁, 실적, 사업 모델을 그대로 붙여넣으세요. 최대 <span class="num">30,000</span>자.</div>
      </button>
      <button class="pick pick-on">
        <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 8px;">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" style="color: var(--seal);"><path d="M5 2.5 H12 L16 6.5 V17.5 H5 Z"/><path d="M12 2.5 V6.5 H16"/></svg>
          <span style="font-size: 15px; font-weight: 600;">PDF 올리기</span>
        </div>
        <div class="t-small" style="color: var(--ink-muted); line-height: 1.55;">회사소개서나 IR 자료를 그대로. 최대 <span class="num">10MB</span>.</div>
      </button>
    </div>

    <!-- PDF 업로드: 올린 뒤 무엇이 읽혔는지 보여준다 -->
    <div style="margin-bottom: 28px;">
      <div class="lbl" style="margin-bottom: 6px;">PDF 파일</div>
      <div style="border: 1px solid var(--rule); background: var(--surface);">
        <div style="display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 15px 16px;">
          <svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" style="color: var(--seal);"><path d="M5 2.5 H12 L16 6.5 V17.5 H5 Z"/><path d="M12 2.5 V6.5 H16"/></svg>
          <div>
            <div style="font-size: 15px; margin-bottom: 3px;">샘플웨이브_회사소개서.pdf</div>
            <div class="t-note" style="color: var(--ink-faint);"><span class="num">4.2MB</span> · <span class="num">31</span>페이지에서 글자 <span class="num">17,720</span>자를 읽었습니다</div>
          </div>
          <button class="btn-ghost" style="height: 32px; font-size: 13px;">바꾸기</button>
        </div>
        <div style="padding: 0 16px 15px 66px;">
          <div class="marginalia" style="grid-template-columns: 64px minmax(0,1fr); gap: 0 14px;">
            <div class="marg marg-fact" style="padding-top: 0;">읽음</div>
            <div class="t-small" style="color: var(--ink-muted); line-height: 1.6;">연혁, 제품 라인, 분기 실적, 협업 이력</div>
            <div class="marg marg-missing" style="padding-top: 8px;">[ ]</div>
            <div class="t-small" style="padding-top: 8px; color: var(--ink-muted); line-height: 1.6;">이미지로만 된 페이지 <span class="num">3</span>장은 글자를 읽지 못했습니다</div>
          </div>
        </div>
      </div>
      <div class="t-note" style="margin-top: 7px; color: var(--ink-faint); line-height: 1.55;">스캔한 이미지 PDF는 글자를 읽을 수 없습니다. 그때는 텍스트로 붙여넣어 주세요.</div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding-top: 24px; border-top: 1px solid var(--rule);">
      <button class="btn-submit" style="width: auto; padding: 0 24px;">12장 만들기</button>
      <span class="t-small" style="color: var(--ink-faint);">보통 <span class="num">2</span>~<span class="num">3</span>분 걸립니다</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
