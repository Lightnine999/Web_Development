
<div style="min-height: 100%; background: var(--paper);">
  <div style="margin: 0 auto; width: 100%; max-width: var(--work); padding: 40px 28px;">

    <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--rule);">
      <h1 class="t-title">IR 자료 만들기</h1>
      <button style="border: 0; background: transparent; font-family: var(--sans); font-size: 14px; color: var(--ink-muted); text-decoration: underline; cursor: pointer; padding: 0;">로그아웃</button>
    </div>

    <!-- 완료: 폼 아래에 성공 문구가 붙고 버튼이 다시 눌린다 -->
    <div style="margin-top: 32px; max-width: var(--read);">
      <div style="display: flex; flex-direction: column; gap: 20px;">

        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span class="lbl">회사명</span>
          <span class="field" style="display: flex; align-items: center;">샘플웨이브</span>
        </label>

        <div style="display: flex; gap: 8px; border-bottom: 1px solid var(--rule);">
          <button class="tab tab-on">텍스트 붙여넣기</button>
          <button class="tab">PDF 업로드</button>
        </div>

        <label style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: baseline; justify-content: space-between;">
            <span class="lbl">회사 정보</span>
            <span class="t-note num" style="color: var(--ink-faint);">1840 / 5000</span>
          </div>
          <div class="area" style="min-height: 268px;">2019년 3월 두 명이 시작했고, 첫 제품은 주방 수납함이었습니다. 2023년 9월 편의점 체인에 입점하면서 매출이 크게 올랐습니다. 2024년 매출은 17억원으로 전년 대비 62% 늘었고, 2025년 6월 도쿄에서 2주 팝업을 열었습니다.</div>
        </label>

        <p class="t-small" style="margin: 0; color: var(--ok);">생성이 끝났습니다. <a href="#" style="text-decoration: underline;">PPTX 다운로드</a></p>

        <button class="btn-submit">12장 만들기</button>
      </div>
    </div>

    <div style="margin-top: 48px;">
      <h2 class="t-note" style="font-weight: 600; padding-bottom: 12px; border-bottom: 1px solid var(--ink); margin: 0;">생성 이력</h2>
      <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">

        <!-- router.refresh() 로 맨 위에 새로 들어온 항목 -->
        <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--rule-soft);">
          <div>
            <div class="t-body">샘플웨이브</div>
            <div class="t-note num" style="color: var(--ink-faint);">2026. 9. 7. 오후 11:24:03</div>
          </div>
          <span class="t-small" style="font-weight: 500; color: var(--seal);">다운로드</span>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--rule-soft);">
          <div>
            <div class="t-body">한결식품</div>
            <div class="t-note num" style="color: var(--ink-faint);">2026. 9. 6. 오후 4:12:08</div>
          </div>
          <span class="t-small" style="font-weight: 500; color: var(--seal);">다운로드</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--rule-soft);">
          <div>
            <div class="t-body">우주양말</div>
            <div class="t-note num" style="color: var(--ink-faint);">2026. 8. 29. 오전 11:03:41</div>
          </div>
          <span class="t-small" style="font-weight: 500; color: var(--seal);">다운로드</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--rule-soft);">
          <div>
            <div class="t-body">대성정밀</div>
            <div class="t-note num" style="color: var(--ink-faint);">2026. 8. 21. 오후 2:47:19</div>
          </div>
          <span class="t-small" style="color: var(--ink-faint);">만료됨</span>
        </div>
      </div>
    </div>

  </div>
</div>
