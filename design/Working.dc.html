<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    /* docs/DESIGN.md 와 src/app/globals.css 의 @theme 값을 그대로 옮긴 것.
       한쪽을 바꾸면 다른 쪽도 바꾼다. */
    :root {
      --paper: oklch(0.985 0.003 85);
      --surface: oklch(1 0 0);
      --ink: oklch(0.24 0.015 265);
      --ink-muted: oklch(0.44 0.012 265);
      --ink-faint: oklch(0.55 0.011 265);
      --rule: oklch(0.89 0.006 265);
      --rule-soft: oklch(0.94 0.004 265);
      --seal: oklch(0.45 0.15 22);
      --seal-deep: oklch(0.36 0.15 22);
      --warn: oklch(0.55 0.11 70);
      --danger: oklch(0.52 0.17 27);
      --ok: oklch(0.45 0.09 155);
      --focus: oklch(0.52 0.16 258);
      --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", monospace;
      --work: 1200px;
      --read: 62ch;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
    a { color: var(--seal); text-decoration: none; }
    a:hover { color: var(--seal-deep); text-decoration: underline; }

    /* 타입 램프 */
    .t-title { font-size: 28px; line-height: 1.28; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
    .t-section { font-size: 20px; line-height: 1.4; font-weight: 600; margin: 0; }
    .t-body { font-size: 16px; line-height: 1.65; }
    .t-small { font-size: 14px; line-height: 1.6; }
    .t-note { font-size: 12px; line-height: 1.5; }
    .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

    /* 실제 코드의 컨트롤 크기 (h-11 = 44px, h-10 = 40px) */
    .field { height: 44px; border: 1px solid var(--rule); background: var(--surface); padding: 0 12px; font-family: var(--sans); font-size: 16px; color: var(--ink); width: 100%; }
    .area { border: 1px solid var(--rule); background: var(--surface); padding: 12px; font-family: var(--sans); font-size: 16px; line-height: 1.65; width: 100%; }
    .btn-submit { height: 44px; width: 100%; border: 0; background: var(--seal); color: var(--surface); font-family: var(--sans); font-size: 14px; font-weight: 500; cursor: pointer; }
    .tab { height: 40px; padding: 0 16px; border: 0; background: transparent; font-family: var(--sans); font-size: 14px; font-weight: 500; color: var(--ink-muted); cursor: pointer; }
    .tab-on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--seal); }
    .lbl { font-size: 14px; line-height: 1.6; color: var(--ink-muted); }
  </style>
</helmet>

<div style="min-height: 100%; background: var(--paper);">
  <div style="margin: 0 auto; width: 100%; max-width: var(--work); padding: 40px 28px;">

    <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--rule);">
      <h1 class="t-title">IR 자료 만들기</h1>
      <button style="border: 0; background: transparent; font-family: var(--sans); font-size: 14px; color: var(--ink-muted); text-decoration: underline; cursor: pointer; padding: 0;">로그아웃</button>
    </div>

    <!-- 생성 중: 폼은 그대로 남고 버튼만 대기 상태가 된다 -->
    <div style="margin-top: 32px; max-width: var(--read);">
      <div style="display: flex; flex-direction: column; gap: 20px;">

        <label style="display: flex; flex-direction: column; gap: 6px;">
          <span class="lbl">회사명</span>
          <span class="field" style="display: flex; align-items: center;">샘플웨이브</span>
        </label>

        <div style="display: flex; gap: 8px; border-bottom: 1px solid var(--rule);">
          <button class="tab tab-on">텍스트 붙여넣기</button>
          <button class="tab">PDF 업로드</button>
        </div>

        <label style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: baseline; justify-content: space-between;">
            <span class="lbl">회사 정보</span>
            <span class="t-note num" style="color: var(--ink-faint);">1840 / 5000</span>
          </div>
          <div class="area" style="min-height: 268px;">2019년 3월 두 명이 시작했고, 첫 제품은 주방 수납함이었습니다. 2023년 9월 편의점 체인에 입점하면서 매출이 크게 올랐습니다. 2024년 매출은 17억원으로 전년 대비 62% 늘었고, 2025년 6월 도쿄에서 2주 팝업을 열었습니다.</div>
        </label>

        <!-- disabled:opacity-60 -->
        <button class="btn-submit" style="opacity: 0.6; cursor: default;">만드는 중... (1~2분 걸릴 수 있습니다)</button>
      </div>
    </div>

    <div style="margin-top: 48px;">
      <h2 class="t-note" style="font-weight: 600; padding-bottom: 12px; border-bottom: 1px solid var(--ink); margin: 0;">생성 이력</h2>
      <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--rule-soft);">
          <div>
            <div class="t-body">한결식품</div>
            <div class="t-note num" style="color: var(--ink-faint);">2026. 9. 6. 오후 4:12:08</div>
          </div>
          <span class="t-small" style="font-weight: 500; color: var(--seal);">다운로드</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--rule-soft);">
          <div>
            <div class="t-body">우주양말</div>
            <div class="t-note num" style="color: var(--ink-faint);">2026. 8. 29. 오전 11:03:41</div>
          </div>
          <span class="t-small" style="font-weight: 500; color: var(--seal);">다운로드</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--rule-soft);">
          <div>
            <div class="t-body">대성정밀</div>
            <div class="t-note num" style="color: var(--ink-faint);">2026. 8. 21. 오후 2:47:19</div>
          </div>
          <span class="t-small" style="color: var(--ink-faint);">만료됨</span>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
